<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Stream</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="pageTitleWrapper">
      <img src="/images/logo.png" alt="Title Logo">
      <span id="pageTitle">Video Library</span>
    </h1>
    <h2 id="videoTitle"></h1>
    <video id="videoPlayer" controls>
      Your browser does not support the video tag.
      <track
        id="subtitlesTrack"
        kind="subtitles"
        srclang="en"
        label="English"
      />
    </video>
    <!-- SCRIPTS -->
    <script src="/config.js"></script>
    <script>
      const getBaseUrl = () => {
        return `${window.location.origin}${window.location.pathname
          .split("/")
          .slice(0, -1)
          .join("/")}`;
      };

      window.onload = function () {
        // Set the page title from config.
        const pageTitle = document.getElementById("pageTitle");
        pageTitle.innerHTML = window.CONFIG.displayName;
        const SAVE_POSITION_INTERVAL = 53; // 53 is just an arbitrary but more searchable number around 50ms.
        const url = new URL(window.location.href);
        const autoplay = url.searchParams.get("autoplay") === "1";

        const videoUrl = url.searchParams.get("path");
        const videoTitle = url.searchParams.get("name");
        const videoType = url.searchParams.get("type"); // movie, series, ...
        const subtitles = url.searchParams.get("subtitle");
        const videoId = url.searchParams.get("id");

        const decodedVideoUrl = decodeURIComponent(videoUrl);
        const videoFolder = decodedVideoUrl.split("/")[0];
        // Page title
        document.getElementById("videoTitle").innerHTML = videoTitle;
        // Video player
        const videoPlayer = document.getElementById("videoPlayer");
        const videoSource = document.createElement("source");
        videoPlayer.append(videoSource);
        videoSource.src = `/file?path=${videoUrl}&type=${videoType}`;

        const clientId = Math.random().toString(36).slice(2);
        const IGNORE_LOCAL_EVENTS_MS = 1000;
        let lastSeq = 0;
        let ignoreLocalEventsUntil = 0;
        const postJson = (endpoint, body) =>
          fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: videoId, path: videoUrl, name: videoTitle, ...body }),
          });
        // Apply another client's play / pause / seek without re-broadcasting it.
        const applyRemoteState = (position, paused) => {
          ignoreLocalEventsUntil = Date.now() + IGNORE_LOCAL_EVENTS_MS;
          videoPlayer.currentTime = position;
          if (paused) videoPlayer.pause();
          else videoPlayer.play().catch(() => {});
        };
        const sendControl = (paused) => {
          if (Date.now() < ignoreLocalEventsUntil) return;
          postJson("/control", { clientId, paused, position: videoPlayer.currentTime });
        };
        videoPlayer.addEventListener("play", () => sendControl(false));
        videoPlayer.addEventListener("pause", () => sendControl(true));
        videoPlayer.addEventListener("seeking", () => sendControl(videoPlayer.paused));

        let pending = false; // ensures there are no overlapping requests. prev request must finish before next.
        const heartbeat = async () => {
          if (!videoId || pending) return;
          pending = true;
          try {

            const res = await postJson("/progress", { position: videoPlayer.currentTime });
            const state = await res.json();
            if (state.seq > lastSeq) {
              lastSeq = state.seq;
              if (state.controlClientId !== clientId) {
                applyRemoteState(state.controlPosition, state.paused);
              }
            }
          } finally {
            pending = false;
          }
        };

        // Join in the shared state, then start the heartbeat.
        fetch(`/progress?id=${videoId}`)
          .then((res) => res.json())
          .then((data) => {
            lastSeq = data.seq;
            applyRemoteState(data.position, data.paused || !autoplay);
            setInterval(heartbeat, SAVE_POSITION_INTERVAL);
          });

        // @TODO: LOCAL STORAGE - USE AS A BACKUP
        //videoPlayer.currentTime = localStorage[videoUrl] || 0;
        // // Subtitles
        // if (subtitles) {
        //   videoPlayer.addEventListener("loadedmetadata", () => {
        //     const tracks = (videoPlayer.textTracks[0].mode = "showing");
        //     const subtitleTrack = document.getElementById("subtitlesTrack");
        //     subtitleTrack.src = `${getBaseUrl()}/subtitles?path=${encodeURIComponent(
        //       videoFolder
        //     )}/${encodeURIComponent(subtitles)}`;
        //   });
        // }
        // Continuously update the current time in local storage.
        // setInterval(() => {
        //   if (videoUrl && videoPlayer.currentTime > 0) {
        //     localStorage[videoUrl] = videoPlayer.currentTime;
        //   }
        // }, SAVE_POSITION_INTERVAL);

      };
    </script>
  </body>
</html>
