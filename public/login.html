<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
  </head>
  <body>
    <form id="loginForm">
      <input name="username" placeholder="Username" />
      <input name="password" type="password" placeholder="Password" />
      <button type="submit">Log in</button>
    </form>

    <form id="signupForm">
      <input name="username" placeholder="Username" />
      <input name="password" type="password" placeholder="Password" />
      <button type="submit">Sign up</button>
    </form>

    <form id="logoutForm">
      <button type="submit">Logout</button>
    </form>

    <div>
      <!-- @TODO: remove this p tag -->
      <p>Watching Along:</p>
      <a id="watchAlongLink" hidden></a>
    </div>

    <script>
      const showWatchAlong = async () => {
        const res = await fetch("/last-watched");
        if (!res.ok) return;
        const { video } = await res.json();
        if (!video?.watchingNow) return;
        const link = document.getElementById("watchAlongLink");
        link.href = `/video.html?path=${encodeURIComponent(video.treePath)}&name=${encodeURIComponent(video.name)}&id=${encodeURIComponent(video.id)}&autoplay=1`;
        link.innerText = `Watch along: ${video.name}`;
        link.hidden = false;
      };

      const setupForm = (formId, endpoint, successMsg, onSuccess) => {
        document
          .getElementById(formId)
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = new FormData(e.target);
            const res = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: data.get("username"),
                password: data.get("password"),
              }),
            });
            if (res.ok) console.log(successMsg);
            if (res.ok && onSuccess) onSuccess();
          });
      };
      setupForm("loginForm", "/login", "Login successful.", showWatchAlong);
      setupForm("signupForm", "/signup", "Signup successful.");
      setupForm("logoutForm", "/logout", "Logout successful.");
    </script>
  </body>
</html>
